<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Smart Fever Guardian – Assignment 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f6fb;--cd:#fff;--tx:#14213d;--mu:#6b7a90;--ac:#2f7bf6;--ok:#1fa971;--wa:#f59e0b;--bad:#e5484d;--bd:#e3e9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1420;--cd:#16202f;--tx:#e8eef7;--mu:#8fa0b8;--bd:#243146}}
:root[data-theme=dark]{--bg:#0d1420;--cd:#16202f;--tx:#e8eef7;--mu:#8fa0b8;--bd:#243146}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:440px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:34px;font-weight:700;line-height:1}.u{font-size:14px;color:var(--mu);font-weight:400}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--bd)}
input:not([type=checkbox]),select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
input.e{border-color:var(--bad)}label{font-size:13px;color:var(--mu)}.err{color:var(--bad);font-size:13px;min-height:18px}
button{font:inherit;border:0;border-radius:12px;padding:13px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
button.s{background:var(--bd);color:var(--tx)}button.r{background:var(--bad)}button.g{background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:440px;width:100%}nav a{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:var(--mu);cursor:pointer}nav a b{display:block;font-size:20px;font-weight:400}nav a.on{color:var(--ac)}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.chk input{width:20px;height:20px}
.dots{display:flex;gap:6px;margin:6px 0 10px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.dots i.on{background:var(--ac)}
.res{border-left:5px solid var(--ok)}.res.w{border-color:var(--wa)}.res.b{border-color:var(--bad)}
.li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.li:last-child{border:0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:11px 16px;border-radius:12px;color:#fff;font-weight:600;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
pre{font-size:11px;overflow-x:auto;background:var(--bg);padding:8px;border-radius:8px;margin:6px 0 0}details summary{cursor:pointer;color:var(--ac);font-weight:600;padding:6px 0}
a.btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:13px 14px;background:var(--ac);color:#fff;font-weight:600;margin-top:8px}a.btn.r{background:var(--bad)}
button.sm{width:auto;padding:6px 12px;font-size:13px;margin:6px 0 0}pre.rp{white-space:pre-wrap;word-break:break-word}.chk.done span{text-decoration:line-through;opacity:.55}
.tm{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block;white-space:pre-wrap;font:12pt/1.45 monospace;color:#000}body{background:#fff}}
</style></head><body>
<div id="toast"></div><div id="app"></div><div id="pa"></div>
<script>
/* MAP: Database · Auth hash pw() · Advisor engine recommend() · tick() sensor · Login/registration auth() doLogin() doReg() logout() · home() · adv() · hist() Log + report + remove dose · kidsV() Children · Cloud sync (FIREBASE_CONFIG, cloud(), push/pull/watch) · Growth · Reminders · SOS · render() */
const $=s=>document.querySelector(s),H=36e5,fm=t=>new Date(t).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),fdt=t=>new Date(t).toLocaleDateString('en',{day:'numeric',month:'short'})+' '+fm(t);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>($('#'+id)||{value:''}).value.trim();
/* ---------- Database (localStorage): users, children, measurements, medications, alerts ---------- */
const DK='sfg_a4',SK='sfg_sess';let db=null,user=null;try{db=JSON.parse(localStorage.getItem(DK))}catch(e){}
const CT=new Set(['children','medications','growth']),uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const save=(sync=true)=>{try{localStorage.setItem(DK,JSON.stringify(db))}catch(e){}if(sync)push()};
const insert=(t,r)=>{r.id=uid();db[t].push(r);save(CT.has(t));return r};
/* ---------- Auth: salted SHA-256 password hash ---------- */
/* PBKDF2-SHA256, 150k iterations (slow on purpose = hard to brute-force) */
async function pw(sl,p){try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(sl),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of sl+p)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
const salt=()=>Math.random().toString(36).slice(2,10);
/* ---------- Children (scoped to logged-in user) ---------- */
const kids=()=>db.children.filter(c=>c.user_id==user.id);
const child=()=>kids().find(c=>c.id==ui.cid)||kids()[0]||null;
const ageOf=c=>Math.floor((Date.now()-new Date(c.dob))/2629800000),ageM=()=>ageOf(child());
const ageT=(c=child())=>ageOf(c)<24?ageOf(c)+' mo':(ageOf(c)/12).toFixed(1)+' y';
function pick(id){ui.cid=id||(kids()[0]||{}).id||null;Object.assign(L,{t:36.9,sp:98,hr:116,hu:30,tg:36.9,sp_:0});ui.step=1;ui.eff=null}
/* ---------- Advisor engine (per child) ---------- */
const DRUGS={par:{n:'Paracetamol',mgkg:15,per:120/5,max:60,gap:4,form:'syrup 120 mg/5 ml'},ibu:{n:'Ibuprofen',mgkg:10,per:100/5,max:30,gap:6,form:'suspension 100 mg/5 ml'}};
const meds=cid=>db.medications.filter(m=>m.child_id==cid);
function nextOk(k,cid){const l=meds(cid).filter(m=>m.drug==k).pop();return l?l.given_at+DRUGS[k].gap*H:0}
function used24(k,cid,now){return meds(cid).filter(m=>m.drug==k&&now-m.given_at<24*H).reduce((a,m)=>a+m.mg,0)}
function recommend(c,temp,spo2,sym,now=Date.now()){
 const mo=ageOf(c),why=[],warn=[];
 if(mo<3)return{status:'urgent',msg:'Babies under 3 months with fever need a doctor immediately. Do not give medicine without medical advice.'};
 if(spo2<92)return{status:'urgent',msg:'Blood oxygen is below 92%. Call a doctor or emergency services now.'};
 let ibuOK=true;
 const rules=[[mo<6,'Ibuprofen is not advised under 6 months'],[sym.vom,'Vomiting/dehydration – ibuprofen strains the kidneys'],[sym.asth,'Asthma – NSAIDs may trigger bronchospasm'],[sym.gi,'Stomach problems – ibuprofen irritates the lining'],[sym.pox,'Chickenpox – ibuprofen not recommended'],[sym.alg,'NSAID allergy']];
 rules.forEach(([f,t])=>{if(f){ibuOK=false;why.push(t)}});
 let sp=60+(temp<38.5?15:0),si=ibuOK?50:-99;
 if(temp>=39&&ibuOK){si+=25;why.push('Temperature ≥ 39°C – ibuprofen lasts longer (6–8 h)')}
 if(sym.ear&&ibuOK){si+=20;why.push('Pain/inflammation – ibuprofen also relieves pain')}
 let k=si>sp?'ibu':'par';
 if(nextOk(k,c.id)>now){const o=k=='par'?'ibu':'par';
  if(o=='par'||ibuOK){if(nextOk(o,c.id)<=now){why.unshift(DRUGS[k].n+' was given recently – alternative selected');k=o}}}
 const d=DRUGS[k],nx=nextOk(k,c.id);
 if(nx>now)return{status:'wait',drug:k,nextAt:nx,why:['Last '+d.n+' dose is too recent',...why],warn:['The other medicine is also not available. Call your pediatrician if the child is unwell.']};
 const mg=Math.round(c.weight*d.mgkg),left=Math.round(c.weight*d.max-used24(k,c.id,now));
 if(left<mg)return{status:'wait',drug:k,nextAt:now+4*H,why:['Daily limit of '+d.n+' reached ('+Math.round(c.weight*d.max)+' mg/24h)'],warn:['Call your pediatrician.']};
 if(!why.length)why.push('Paracetamol is the first-choice drug for children');
 return{status:'ok',drug:k,mg,ml:+(mg/d.per).toFixed(1),why,warn,left,conf:Math.min(96,Math.round(70+Math.abs(sp-si)/2)),temp};
}
/* ---------- Live sensor simulation (active child) ---------- */
const L={t:36.9,sp:98,hr:116,hu:30,tg:36.9,sp_:0,n:0};
function tick(){const c=user&&child();if(!c)return;
 if(L.sp_>0){L.t=Math.min(L.t+.35,39);L.sp_--}else L.t+=(L.tg-L.t)*.1+(Math.random()-.5)*.04;
 L.sp=Math.round(Math.min(100,Math.max(90,L.sp+(98-L.sp)*.1+(Math.random()-.5))));L.hr=Math.round(L.hr+(105+(L.t-36.6)*10-L.hr)*.1+(Math.random()-.5)*3);L.hu=Math.min(100,L.hu+Math.random()*1.5);
 if(++L.n%5==0){insert('measurements',{child_id:c.id,ts:Date.now(),temp:+L.t.toFixed(2),spo2:L.sp,hr:L.hr,humidity:Math.round(L.hu)});if(db.measurements.length>300){db.measurements.shift();save(false)}}
 if(L.t>38.5&&!db.alerts.some(a=>a.child_id==c.id&&Date.now()-a.ts<6e5))insert('alerts',{child_id:c.id,ts:Date.now(),type:'FEVER',value:+L.t.toFixed(1),acked:0});
 if(ui.tab=='home')render()}
/* ---------- UI state ---------- */
let ui={gm:'weight',mform:false,lockK:null,mf:{},tab:'home',step:1,f:{w:'',t:'',sym:{}},res:null,err:{},eff:null,reg:false,af:{},fails:0,lock:0,cid:null,edit:undefined,kf:{},del:null,lf:{c:'all',d:'all'},rm:null,sz:{start:null,end:null,fired:false},sos:{f:{},s:{}}};
const toast=(m,c='#1fa971')=>{const e=$('#toast');e.textContent=m;e.style.background=c;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)};
const go=t=>{if(t=='adv'&&!child()){toast('Add a child first','#f59e0b');t='kids'}
 ui.tab=t;ui.err={};ui.edit=undefined;ui.del=null;ui.rm=null;ui.mform=false;
 if(t=='adv'&&ui.step!=5){ui.step=1;ui.f={w:child().weight,t:+L.t.toFixed(1),sym:{}}}render();scrollTo(0,0)};
const fld=(e,l,id,t,v,k,x='')=>`<label>${l}</label><input id="${id}" type="${t}" ${x} value="${esc(v??'')}" class="${e[k]?'e':''}"><div class="err">${e[k]||''}</div>`;
/* ---------- Login / registration ---------- */
function auth(){const e=ui.err,r=ui.reg,a=ui.af;
return`<h1>🌡 Smart Fever Guardian</h1><div class="mu">${r?'Create your account':'Sign in to your account'}</div><div class="card">
${fld(e,'Username','au','text',a.u,'u','autocomplete="username" autocapitalize="none"')}
${r?fld(e,'Your name','an','text',a.n,'n'):''}
${fld(e,'Password','ap','password','','p','autocomplete="'+(r?'new':'current')+'-password"'+(r?'':' onkeydown="if(event.key==\'Enter\')doLogin()"'))}
${r?fld(e,'Repeat password','ac','password','','c','autocomplete="new-password"'):''}
<div class="err" id="ge">${e.g||''}</div></div>
<button onclick="${r?'doReg()':'doLogin()'}">${r?'Create account':'Sign in'}</button>
<button class="s" onclick="ui.reg=!ui.reg;ui.err={};ui.af={};render()">${r?'I already have an account':'Register new account'}</button>
${r?'':'<div class="mu" style="margin-top:10px">Demo account: <b>aigerim</b> / <b>Demo1234</b></div>'}`}
function enter(x){user=x;try{localStorage.setItem(SK,x.id)}catch(e){}ui.err={};ui.af={};ui.tab='home';ui.lockK=null;pick();watch();render();toast('Welcome, '+x.name)}
const MAXF=3,lockMsg=k=>'Too many wrong attempts. Try again in '+Math.ceil((k.until-Date.now())/1000)+' s';
function countdown(){if(user||!ui.lockK)return;const el=$('#ge');if(ui.lockK.until>Date.now()){ui.err.g=lockMsg(ui.lockK);if(el)el.textContent=ui.err.g}else{ui.lockK=null;ui.err={};render()}}
async function saveLock(x,u){save(false);if(x&&CL){try{await accRef(u).update({fails:x.fails,until:x.until,lvl:x.lvl})}catch(e){}}}
async function doLogin(){const u=val('au').toLowerCase(),p=$('#ap').value,e={};ui.af={u};
 if(!u)e.u='Enter your username';if(!p)e.p='Enter your password';
 if(Object.keys(e).length){ui.err=e;render();toast('Please fix the highlighted fields','#e5484d');return}
 const x=await getAcc(u),k=x||(db.locks[u]=db.locks[u]||{fails:0,until:0,lvl:0});
 if((k.until||0)>Date.now()){ui.lockK=k;ui.err={g:lockMsg(k)};render();toast('Login temporarily blocked','#e5484d');return}
 if(x&&await pw(x.salt,p)==x.hash){k.fails=0;k.lvl=0;k.until=0;await saveLock(x,u);await pull0(x);return enter(x)}
 k.fails=(k.fails||0)+1;
 if(k.fails>=MAXF){k.until=Date.now()+Math.min(60*2**(k.lvl||0),900)*1000;k.lvl=(k.lvl||0)+1;k.fails=0;ui.lockK=k;e.g=lockMsg(k)}
 else e.g='Incorrect username or password. Attempts left: '+(MAXF-k.fails);
 await saveLock(x,u);ui.err=e;render();toast(e.g,'#e5484d')}
async function pull0(x){user=x;await pull()}
async function doReg(){const u=val('au').toLowerCase(),n=val('an'),p=$('#ap').value,c=$('#ac').value,e={};ui.af={u,n};
 if(!u)e.u='Choose a username';else if(!/^[a-z0-9_]{3,20}$/.test(u))e.u='3–20 characters: letters, digits, underscore';else if(await getAcc(u))e.u='This username is already taken';
 if(!n)e.n='Enter your name';
 if(p.length<8||!/[a-zA-Z]/.test(p)||!/\d/.test(p))e.p='At least 8 characters, with a letter and a digit';
 if(c!=p)e.c='Passwords do not match';
 if(Object.keys(e).length){ui.err=e;render();toast('Please fix the highlighted fields','#e5484d');return}
 const sl=salt(),x=insert('users',{username:u,name:n,phone:'',salt:sl,hash:await pw(sl,p),fails:0,until:0,lvl:0});user=x;enter(x);push()}
function logout(){user=null;if(unsub){unsub();unsub=null}try{localStorage.removeItem(SK)}catch(e){}ui.reg=false;ui.err={};render()}
/* ---------- Home ---------- */
const st=()=>L.t>38.5?['bad','High fever']:L.t>=37.5?['wa','Elevated']:['ok','Normal'];
function home(){const c0=child();
if(!c0)return`<h1>Hello, ${esc(user.name)}</h1><div class="card"><b>No children yet</b><div class="mu">Add your first child to start monitoring.</div></div><button onclick="go('kids');editK(null)">➕ Add child</button>`;
const[c,tx]=st(),lm=meds(c0.id).pop(),nx=lm?lm.given_at+DRUGS[lm.drug].gap*H:0,al=L.t>38.5;
return`<div class="row"><select onchange="pick(+this.value);render()">${kids().map(k=>`<option value="${k.id}" ${k.id==c0.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select><button class="s" style="width:auto;margin:0;white-space:nowrap" onclick="go('kids');editK(null)">+ Child</button></div>
<div class="row" style="margin-top:8px"><div><h1>${esc(c0.name)}</h1><div class="mu">${ageT()} · ${c0.weight} kg · ${c0.height} cm</div></div><span class="pill ${syncSt=='ok'?'ok':'wa'}">${syncSt=='ok'?'☁ Synced':syncSt=='err'?'⚠ Sync error':'📴 Local only'}</span></div>
${al?`<div class="card" style="background:var(--bad);color:#fff;border:0"><b>🚨 Fever alert: ${L.t.toFixed(1)}°C</b><div style="font-size:13px">Above your 38.5°C threshold</div><button style="background:#fff;color:var(--bad)" onclick="go('adv')">Get AI advice</button></div>`:''}
<div class="card"><div class="row"><span class="mu">Temperature</span><span class="pill ${c}">${tx}</span></div><div class="big ${c}" style="margin-top:6px">${L.t.toFixed(1)}<span class="u"> °C</span></div></div>
<div class="g2"><div class="card"><div class="mu">SpO₂</div><div class="big ${L.sp<92?'bad':'ok'}">${L.sp}<span class="u">%</span></div></div><div class="card"><div class="mu">Pulse</div><div class="big">${L.hr}<span class="u"> bpm</span></div></div></div>
${medCard(c0)}
<button onclick="go('adv')">🤖 AI Medication Advisor</button>
<div class="card" style="margin-top:14px"><div class="mu">Demo controls</div><div class="g2"><button class="s" onclick="L.sp_=8;L.tg=39">🔥 Fever spike</button><button class="s" onclick="L.sp_=0;L.tg=36.9">❄ Cool down</button></div></div>`}
/* ---------- Advisor ---------- */
const dots=n=>`<div class="dots">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
function adv(){const s=ui.step,f=ui.f,e=ui.err,c0=child();
if(s==1)return`<h1>Check data: ${esc(c0.name)}</h1><div class="mu">Step 1 of 3 · confirm values used for dosing</div>${dots(1)}<div class="card">${fld(e,'Weight (kg)','w','number',f.w,'w','step=".1"')}${fld(e,'Temperature (°C) – from patch, editable','t','number',f.t,'t','step=".1"')}<div class="mu">Age: ${ageT()} · SpO₂ ${L.sp}%</div></div><button onclick="s1()">Next</button>`;
if(s==2){const S=[['vom','Vomiting / dehydration'],['asth','Asthma / wheezing'],['gi','Stomach problems'],['pox','Chickenpox'],['alg','NSAID allergy'],['ear','Ear / teething pain']],lm=meds(c0.id).pop();
return`<h1>Symptoms & history</h1><div class="mu">Step 2 of 3 · tick everything that applies</div>${dots(2)}<div class="card">${S.map(([k,l])=>`<label class="chk"><input type="checkbox" id="c_${k}" ${f.sym[k]?'checked':''}> <span style="color:var(--tx);font-size:15px">${l}</span></label>`).join('')}<div class="mu" style="margin-top:8px">Last dose: ${lm?DRUGS[lm.drug].n+' '+lm.mg+' mg at '+fm(lm.given_at):'none recorded'}</div></div><button onclick="s2()">Get recommendation</button><button class="s" onclick="ui.step=1;render()">Back</button>`}
if(s==3){const r=ui.res,d=DRUGS[r.drug];
if(r.status=='urgent')return`<h1>Step 3 of 3</h1>${dots(3)}<div class="card res b"><b class="bad">⚠ Seek medical help</b><p>${r.msg}</p></div><button class="r" onclick="toast('Calling pediatrician… (demo)','#e5484d')">📞 Call pediatrician</button><button class="s" onclick="go('home')">Home</button>`;
if(r.status=='wait')return`<h1>Step 3 of 3</h1>${dots(3)}<div class="card res w"><b class="wa">⏳ Not safe to give yet</b><div class="big" style="font-size:26px;margin:8px 0">Wait until ${fm(r.nextAt)}</div><div class="mu">in ${Math.ceil((r.nextAt-Date.now())/6e4)} min</div>${r.why.map(x=>`<div class="li">• ${x}</div>`).join('')}${r.warn.map(x=>`<div class="li wa">${x}</div>`).join('')}</div><button onclick="remindMe('${r.drug}',${r.nextAt})">🔔 Remind me</button><button class="s" onclick="ui.step=2;render()">Change answers</button>`;
return`<h1>Recommendation</h1>${dots(3)}<div class="card res"><div class="row"><span class="mu">AI suggests</span><span class="pill">confidence ${r.conf}%</span></div><div style="font-size:15px;margin-top:6px"><b>${d.n}</b> · ${r.mg} mg</div><div class="big ok" style="margin:6px 0">Give ${r.ml} ml</div><div class="mu">${d.form} · every ${d.gap}+ h · ${r.left} mg left today</div>
<details><summary>Why this choice?</summary>${r.why.map(x=>`<div class="li">• ${x}</div>`).join('')}</details>${r.warn.map(x=>`<div class="li wa">${x}</div>`).join('')}</div>
<button class="g" onclick="ui.step=4;render()">I will give this dose</button><button class="s" onclick="ui.step=2;render()">Change answers</button><div class="mu" style="margin-top:8px">Decision support only – not a prescription. Consult a pediatrician if unsure.</div>`}

/* ---------- Medicine timers, safe-dose time (interval + rolling 24 h limit) ---------- */
function safeAt(k,c,now=Date.now()){const d=DRUGS[k],one=Math.round(c.weight*d.mgkg),lim=c.weight*d.max,ds=meds(c.id).filter(m=>m.drug==k);let t=Math.max(now,nextOk(k,c.id));
 for(let i=0;i<20;i++){const n=ds.filter(m=>m.given_at>t-24*H&&m.given_at<=t);if(lim-n.reduce((a,m)=>a+m.mg,0)>=one)return t<=now?0:t;t=Math.min(...n.map(m=>m.given_at))+24*H}return t}
const fmLeft=ms=>{const m=Math.max(1,Math.ceil(ms/6e4)),h=Math.floor(m/60);return(h?h+' h ':'')+(m%60?m%60+' min ':'')+'left'};
function remHint(){return!('Notification' in window)?'Browser notifications are not supported here – in-app alerts only.':REM.on?(Notification.permission=='granted'?'Notified 15 min before and at the safe time. Keep this page open.':'Notifications are blocked – in-app alerts only.'):'Get a notification 15 min before and at each safe dose time.'}
function medCard(c){const now=Date.now();return`<div class="card"><div class="row"><span class="mu">Medicine timers</span><span class="pill ${REM.on?'ok':''}">${REM.on?'🔔 Reminders on':'🔕 Reminders off'}</span></div>${Object.keys(DRUGS).map(k=>{const d=DRUGS[k],at=safeAt(k,c),l=meds(c.id).filter(m=>m.drug==k).pop();return`<div class="li"><div class="row"><b>${d.n}</b><b class="${at?'wa':'ok'}">${at?'⏳ '+fmLeft(at-now):'✅ Ready'}</b></div><div class="mu">${l?'Last '+fm(l.given_at)+' · ':'No doses · '}${at?'next safe '+fm(at)+' · ':''}${used24(k,c.id,now)}/${Math.round(c.weight*d.max)} mg in 24 h</div></div>`}).join('')}<button class="s" onclick="toggleRem()">${REM.on?'🔕 Turn reminders off':'🔔 Enable reminders'}</button><div class="mu" style="margin-top:6px">${remHint()}</div></div>`}
/* ---------- Smart reminders (browser notifications: 15 min before + at safe time) ---------- */
const RK='sfg_rem';let REM={on:false,custom:[],fired:{}};try{REM={...REM,...JSON.parse(localStorage.getItem(RK))}}catch(e){}
const remSave=()=>{try{localStorage.setItem(RK,JSON.stringify(REM))}catch(e){}};
function notify(t,b,tag,col='#2f7bf6'){toast('🔔 '+b,col);try{if('Notification' in window&&Notification.permission=='granted'){try{new Notification(t,{body:b,tag})}catch(e){navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification(t,{body:b,tag}))}}}catch(e){}}
async function askPerm(){if(!('Notification' in window))return'unsupported';if(Notification.permission=='default'){try{await Notification.requestPermission()}catch(e){}}return Notification.permission}
async function toggleRem(){if(REM.on){REM.on=false;remSave();render();toast('Reminders off','#6b7a90');return}
 const p=await askPerm();REM.on=true;remSave();render();toast(p=='granted'?'Reminders on – you will be notified':'Reminders on (in-app only: notifications '+(p=='unsupported'?'not supported':'blocked')+')',p=='granted'?'#1fa971':'#f59e0b');checkRem()}
async function remindMe(k,at){const c=child(),p=await askPerm();REM.custom=REM.custom.filter(r=>!(r.cid==c.id&&r.drug==k&&r.at==at));REM.custom.push({cid:c.id,drug:k,at});REM.on=true;remSave();
 toast('Reminder set for '+fm(at)+(p=='granted'?'':' (in-app only)'),p=='granted'?'#1fa971':'#f59e0b');checkRem()}
function checkRem(){if(!user||!REM.on)return;const now=Date.now(),E={};
 kids().forEach(c=>Object.keys(DRUGS).forEach(k=>{const l=meds(c.id).filter(m=>m.drug==k).pop();if(l){const at=safeAt(k,c,l.given_at);E[c.id+':'+k+':'+at]={c,k,at}}}));
 REM.custom.forEach(r=>{const c=kids().find(x=>x.id==r.cid);if(c)E[r.cid+':'+r.drug+':'+r.at]={c,k:r.drug,at:r.at}});

  if(now>=at-15*6e4&&now<at&&!REM.fired[key+'p']){REM.fired[key+'p']=now;notify('Next dose soon',c.name+': '+n+' can be given in '+Math.ceil((at-now)/6e4)+' min (at '+fm(at)+')',key+'p')}

function buildReport(c){const now=Date.now(),t0=now-24*H,L=[],ln=s=>L.push(s),dd=meds(c.id).filter(m=>m.given_at>=t0).sort((a,b)=>a.given_at-b.given_at),sn=db.measurements.filter(m=>m.child_id==c.id&&m.ts>=t0).sort((a,b)=>a.ts-b.ts),al=db.alerts.filter(a=>a.child_id==c.id&&a.ts>=t0);

 Object.keys(DRUGS).forEach(k=>{const d=DRUGS[k],u=used24(k,c.id,now),lim=Math.round(c.weight*d.max),n=dd.filter(m=>m.drug==k).length;ln(`${d.n}: ${u} / ${lim} mg (${Math.round(100*u/lim)}%) · ${n} dose${n==1?'':'s'}${u>lim*.8?'  !! near limit':''}`)});

function reportCard(){const c=rptChild();if(!c)return'';return`<div class="card"><h2>📄 24-hour medical report</h2><div class="mu">${esc(c.name)} · temperatures, doses, daily totals vs limit, next safe dose</div><details><summary>Preview report</summary><pre class="rp">${esc(buildReport(c))}</pre></details><div class="g2"><button class="s" onclick="rptAct('copy')">📋 Copy</button><button class="s" onclick="rptAct('txt')">⬇ Download TXT</button><button class="s" onclick="rptAct('share')">📤 Share</button><button class="s" onclick="rptAct('pdf')">🖨 Save as PDF</button></div></div>`}

const SOS_F=['Re-check the temperature and note the time','Undress to light clothing; keep the room cool (no cold bath, no alcohol rub)','Offer small sips of fluid often','Give medicine only if the Advisor says it is safe – never above the daily limit','Look for red flags: stiff neck, rash that does not fade under pressure, trouble breathing, blue or grey lips, very hard to wake, repeated vomiting, no urine for 8 h','Call 103 / 112 now if any red flag appears, a baby under 3 months has fever, or temperature is 40 °C+ and not falling 1 h after a dose'];
